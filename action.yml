# Observer config-as-code — GitHub composite action.
#
# On pull_request: `dry-run` (prints the plan to the job log and fails the
# check on invalid config; nothing is posted to the pull request).
# On push to main: `apply`.
#
# Runs the CLI with the Node already present on GitHub-hosted runners — no
# binary download needed inside CI.
#
# Usage:
#   - uses: useobserver/cli@v1
#     with:
#       file: observer.yaml
#       mode: ${{ github.event_name == 'pull_request' && 'dry-run' || 'apply' }}
#     env:
#       OBSERVER_API_URL: ${{ vars.OBSERVER_API_URL }}   # optional; unset/empty = https://use.observer
#       OBSERVER_API_KEY: ${{ secrets.OBSERVER_API_KEY }}
name: "Observer config apply"
description: "Apply (or dry-run) an Observer config-as-code document via the public API"
branding:
  icon: "check-circle"
  color: "blue"
inputs:
  file:
    description: "Path to the Observer config YAML"
    required: true
    default: "observer.yaml"
  mode:
    description: "apply | dry-run"
    required: false
    default: "dry-run"
  prune:
    description: "Delete config-managed objects not present in the document"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Apply Observer config
      shell: bash
      # Inputs reach the script through env vars, never inline `${{ }}`
      # expansion, so a crafted value cannot inject shell.
      env:
        OBSERVER_INPUT_FILE: ${{ inputs.file }}
        OBSERVER_INPUT_MODE: ${{ inputs.mode }}
        OBSERVER_INPUT_PRUNE: ${{ inputs.prune }}
        OBSERVER_ACTION_PATH: ${{ github.action_path }}
      run: |
        flags=()
        case "$OBSERVER_INPUT_MODE" in
          dry-run) flags+=(--dry-run) ;;
          apply) ;;
          *) echo "::error::mode must be 'apply' or 'dry-run' (got '$OBSERVER_INPUT_MODE')"; exit 1 ;;
        esac
        [ "$OBSERVER_INPUT_PRUNE" = "true" ] && flags+=(--prune)
        node "$OBSERVER_ACTION_PATH/bin.mjs" apply -f "$OBSERVER_INPUT_FILE" "${flags[@]}"
